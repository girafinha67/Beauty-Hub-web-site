<title>Beauty Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Visual: fundo claro e quente, muito espaço em branco, vinho só nos botões e no logo, rosé como único acento. */
:root{
  --bg:#FBF7F6; --surface:#FFFFFF; --surface2:#F6EDEC; --soft:#F7E9EB; --ink:#2B0A18; --muted:#7C646B; --line:#EDE1E1;
  --wine:#4A0E24; --on-wine:#FFFFFF; --accent-ink:#4A0E24; --rose:#B87C86;
  --ok:#2F7A55; --warn:#A8651B; --bad:#A8322F;
  --shadow:0 1px 2px rgba(74,14,36,.05),0 12px 32px rgba(74,14,36,.07);
  --display:'Cormorant Garamond',Georgia,serif; --body:'Jost','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#150710; --surface:#1E0F19; --surface2:#28161F; --soft:#2F1822; --ink:#F6E8EB; --muted:#BE9AA3; --line:#36202C;
  --wine:#9B3158; --on-wine:#FFFFFF; --accent-ink:#F0C9D1; --rose:#D79AA6;
  --ok:#6FC79B; --warn:#E3A862; --bad:#F08A86; --shadow:0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.1;margin:0;text-wrap:balance}
.sec-h{margin:56px 0 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:30px}
.sec-h small{color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;padding:0;font-size:14px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.linkbtn:hover{color:var(--rose)}
/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.logo{background:none;border:0;padding:0;font-family:var(--display);font-weight:600;font-size:28px;color:var(--accent-ink);letter-spacing:.01em;white-space:nowrap}
.nav{display:flex;gap:2px;flex:1;min-width:0;justify-content:center}
.nav button{background:none;border:0;color:var(--muted);font-size:15px;padding:8px 14px;border-radius:999px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
.nav .only-m{display:none}
.hdr-r{display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);position:relative}
.ib .cnt{position:absolute;top:-4px;right:-4px;background:var(--wine);color:var(--on-wine);border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;font-weight:500}
.menu-btn{display:none}
.ib.out{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wine);color:var(--on-wine);border:1px solid var(--wine);border-radius:999px;padding:10px 22px;font-size:15px;font-weight:500;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--rose);filter:none}
.btn.sm{padding:6px 16px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
/* hero */
.hero{padding:64px 0 8px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(40px,6.5vw,60px);font-weight:500;letter-spacing:.005em}
.hero p.sub{max-width:540px;margin:16px 0 0;color:var(--muted);font-size:18px}
.hero.home{padding:88px 0 40px}
.hero.home h1{font-size:clamp(46px,8vw,84px);font-weight:400}
.hero .wrap{position:relative}
.hero .lash{position:absolute;right:-30px;top:-20px;width:min(520px,60%);height:auto;color:var(--rose);opacity:.35;pointer-events:none}
.hero-act{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 20px;max-width:560px;margin-top:28px;box-shadow:var(--shadow)}
.search svg{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:10px 4px;font-size:16px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-items:start}
.list{display:grid;gap:20px;max-width:720px;margin-top:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--shadow);border-color:var(--rose)}
.badge,.tag{align-self:flex-start;background:var(--soft);color:var(--accent-ink);font-size:12.5px;padding:3px 12px;border-radius:999px}
.card h3{font-size:30px;padding-right:44px}
.card h3 button{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.card p{margin:0;color:var(--muted)}
.heart{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.heart.on{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.heart.on svg{fill:currentColor}
.meta{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14.5px;color:var(--muted)}
.meta li{display:flex;gap:8px;align-items:center}
.meta svg{color:var(--rose)}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.card-f .more{display:inline-flex;gap:6px;align-items:center;color:var(--accent-ink);font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.rate{display:inline-flex;gap:5px;align-items:center;color:var(--warn);font-weight:500;font-size:14px}
.rate span{color:var(--muted);font-weight:400}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ok)}
.av{width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:500;font-size:16px;flex:none}
.av.lg{width:84px;height:84px;font-size:28px;font-family:var(--display)}
/* module tiles */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mod:hover{border-color:var(--rose);box-shadow:var(--shadow)}
.mod .ico{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;margin-bottom:6px}
.mod h3{font-size:26px}
.mod small{color:var(--muted);font-size:14px;line-height:1.45}
/* cta */
.cta{margin:64px 0 8px;padding:32px;border-radius:22px;background:var(--soft);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h3{font-size:30px}
.cta p{margin:6px 0 0;color:var(--muted);max-width:460px}
.empty-state{border:1px dashed var(--line);border-radius:18px;padding:36px;text-align:center;color:var(--muted)}
.empty-state h2{color:var(--ink);font-size:34px;margin-bottom:8px}
.empty-state .btn{margin-top:14px}
/* rows (radar, discussões) */
.stack{display:flex;flex-direction:column;gap:12px}
.row-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:center}
.row-card h3{font-size:24px}
.row-card small{color:var(--muted)}
.dt{width:56px;flex:none;text-align:center;line-height:1}
.dt b{display:block;font-family:var(--display);font-size:34px;font-weight:500}
.dt span{font-size:12px;color:var(--rose);text-transform:uppercase;letter-spacing:.1em}
.mini{display:flex;align-items:center;gap:14px}
.mini b{display:block;font-weight:500}
.mini small{color:var(--muted)}
.mini .grow{flex:1;min-width:0}
/* footer */
.ftr{margin-top:96px;border-top:1px solid var(--line);padding:32px 0 36px}
.ftr-row{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.ftr .logo{font-size:24px}
.ftr-links{list-style:none;margin:0;padding:0;display:flex;gap:6px 22px;flex-wrap:wrap}
.ftr-links button{background:none;border:0;padding:0;color:var(--muted);font-size:14px}
.ftr-links button:hover{color:var(--ink)}
.legal{margin:18px 0 0;font-size:13px;color:var(--muted)}
/* overlay */
.ov{position:fixed;inset:0;z-index:80;background:rgba(20,5,12,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px;max-width:600px;width:100%;max-height:100%;overflow:auto;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.sheet .x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;z-index:3}
.sheet .body{padding:34px 30px 30px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:38px;padding-right:44px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:15px}
.fact small{display:block;color:var(--muted);font-size:12px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}
.note{margin:0;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--wine);color:var(--on-wine);padding:11px 20px;border-radius:999px;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* cadastro */
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--wine)}
.su{max-width:820px;margin:48px auto 0}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px}
.su-card h2{font-size:42px;margin:6px 0 6px}
.eyebrow{font-size:13px;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 24px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;position:relative}
.opt svg{font-size:24px;color:var(--rose);margin-bottom:6px}
.opt b{font-weight:500}
.opt small{color:var(--muted);font-size:13px;line-height:1.4}
.opt:hover{border-color:var(--rose)}
.opt[aria-pressed="true"]{border-color:var(--wine);background:var(--soft);box-shadow:0 0 0 1px var(--wine)}
.form{display:flex;flex-direction:column;gap:16px;max-width:520px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:14px;color:var(--muted)}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=number],.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--rose)}
.f textarea{min-height:110px;resize:vertical}
.f .err{color:var(--bad);font-size:13px}
.f .hint{font-size:12px;color:var(--muted);text-align:right}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ck input{margin-top:4px;accent-color:var(--wine);width:17px;height:17px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 24px;margin:12px 0 16px}
.svc h4{margin:14px 0 4px;font-size:13px;color:var(--muted);grid-column:1/-1;font-weight:500}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;margin:0 auto 22px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 22px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--wine);color:var(--on-wine)}
.seg small{display:block;font-size:11px;opacity:.85;line-height:1.2}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;align-items:stretch}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:10px;position:relative}
.plan.pop{border-color:var(--wine)}
.plan .pop-t{position:absolute;top:-12px;left:22px;background:var(--wine);color:var(--on-wine);font-size:12px;padding:2px 12px;border-radius:999px}
.plan h3{font-size:30px}
.plan .price{font-size:30px;font-weight:500}
.plan .price small{font-size:14px;color:var(--muted);font-weight:400}
.plan ul{list-style:none;padding:0;margin:6px 0 12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;flex:1}
.plan li{display:flex;gap:8px}
.plan li svg{color:var(--rose);margin-top:4px}
.plan.sel{box-shadow:0 0 0 2px var(--rose)}
.success{text-align:center;padding:30px 10px}
.success .ok{width:76px;height:76px;border-radius:50%;background:var(--wine);color:var(--on-wine);display:grid;place-items:center;margin:0 auto 16px;font-size:32px}
/* perfil */
.pf{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start;margin-top:48px}
.pf-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pf-hero h1{font-size:44px;font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:13px;padding:3px 12px;background:var(--soft);color:var(--warn)}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:26px 0 20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--wine)}
.locked{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:999px;padding:6px 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
.panel h3{font-size:24px;margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.thumbs div{height:110px;border-radius:14px;background:var(--soft);color:var(--rose);display:grid;place-items:center;font-size:30px}
/* admin */
.adm-warn{background:var(--soft);border-radius:12px;padding:10px 16px;font-size:14px;margin:36px 0 22px;color:var(--muted)}
.adm-warn b{color:var(--ink);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat b{display:block;font-family:var(--display);font-size:42px;font-weight:500;line-height:1}
.stat small{color:var(--muted)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th{font-size:13px;color:var(--muted);font-weight:400;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.perm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px}
.chip.on{background:var(--wine);color:var(--on-wine);border-color:var(--wine)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
/* entrada (login e criar conta) */
.auth{min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:max(28px,env(safe-area-inset-top,0px)) 20px 40px}
.bubble{position:absolute;border-radius:50%;pointer-events:none}
.bubble.b1{width:min(360px,70vw);height:min(360px,70vw);left:-12%;top:-4%;background:var(--soft)}
.bubble.b2{width:min(300px,55vw);height:min(300px,55vw);right:-14%;top:-2%;background:var(--surface2);opacity:.8}
.bubble.b3{width:min(300px,60vw);height:min(300px,60vw);left:-16%;bottom:-6%;background:var(--surface2);opacity:.7}
.bubble.b4{width:min(340px,60vw);height:min(340px,60vw);right:-18%;bottom:-4%;background:var(--soft);opacity:.8}
.auth-in{position:relative;z-index:1;width:100%;max-width:440px;margin-top:8px}
.auth-in.wide{margin-top:0}
.auth-logo{display:flex;flex-direction:column;align-items:center;margin:10px 0 56px;text-align:center}
.auth-logo b{font-family:var(--display);font-weight:600;font-size:40px;color:var(--accent-ink);line-height:1;margin-top:6px}
.auth-logo small{color:var(--rose);font-size:14px;margin-top:6px}
.pinlogo{display:inline-flex;color:var(--wine)}
.pinlogo svg{width:62px;height:auto}
.pinlogo.sm svg{width:34px}
[data-x] .pinlogo{color:var(--rose)}
@media (prefers-color-scheme: dark){.pinlogo{color:var(--rose)}}
.auth h1{font-family:var(--body);font-weight:600;font-size:40px;letter-spacing:-.01em}
.uline{display:block;width:50px;height:4px;border-radius:4px;background:var(--rose);margin:12px 0 16px}
.auth .lead{margin:0 0 26px;font-size:18px}
.auth-top{position:relative;z-index:1;width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.auth-top .sp{width:44px}
.backb{width:44px;height:44px;border:0;background:none;color:var(--accent-ink);display:grid;place-items:center;font-size:24px}
.af{margin-bottom:18px}
.af label{display:block;font-weight:600;margin-bottom:8px}
.inp{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:0 20px;min-height:62px;box-shadow:0 2px 8px rgba(74,14,36,.05)}
.inp:focus-within{border-color:var(--rose);box-shadow:0 0 0 3px var(--soft)}
.inp.bad{border-color:var(--bad)}
.inp>svg{color:var(--muted);font-size:22px}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:17px;padding:14px 0;appearance:none;-webkit-appearance:none}
.inp.sel{margin-bottom:18px;position:relative;font-weight:600}
.inp.sel select{cursor:pointer}
.inp.sel>svg{transform:rotate(90deg);color:var(--accent-ink)}
.inp input::placeholder{color:var(--muted);opacity:.65}
.eye{background:none;border:0;color:var(--muted);font-size:22px;display:grid;place-items:center;padding:6px}
.auth .err{color:var(--bad);font-size:14px;margin-top:6px}
.auth .formerr{min-height:20px;margin:0 0 10px;text-align:center}
.forgot{text-align:right;margin:-4px 0 22px}
.forgot button,.lk{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;font-size:inherit}
.forgot button{font-size:16px}

const pd=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const fd=iso=>{const t=pd(iso);return `${t.getDate()} de ${MONTHS[t.getMonth()]} de ${t.getFullYear()}`};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const daysTo=iso=>Math.round((pd(iso)-today())/864e5);
function dateLabel(it){
  if(!it.date)return 'Início imediato';
  if(!it.end)return fd(it.date);
  const a=pd(it.date),b=pd(it.end);
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return `${a.getDate()} a ${b.getDate()} de ${MONTHS[a.getMonth()]} de ${a.getFullYear()}`;
  return fd(it.date)+' a '+fd(it.end);
}
function whenTxt(it){
  if(!it.date)return 'Início imediato';
  const last=daysTo(it.end||it.date);
  return last<0?dateLabel(it)+' (encerrado)':dateLabel(it);
}
const inDays=iso=>{const d=daysTo(iso);return d<0?'encerrado':d===0?'hoje':d===1?'amanhã':`em ${d} dias`};

/* Detalhe decorativo: uma linha de cílios, bem discreta. */
function lashArc(){
  let l='',lid='';
  for(let i=0;i<=24;i++){
    const t=i/24,x=20+t*360,y=170-Math.sin(t*Math.PI)*58,th=-Math.PI/2+(t-.5)*1.4,L=22+Math.sin(t*Math.PI)*40;
    const ex=x+Math.cos(th)*L,ey=y+Math.sin(th)*L,cx=x+Math.cos(th)*L*.55+(t<.5?-4:4),cy=y+Math.sin(th)*L*.55;
    lid+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    if(i%1===0)l+=`M${x.toFixed(1)} ${y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
  }
  return `<svg class="lash" viewBox="0 0 400 200" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="${lid}"/><path d="${l}"/></g></svg>`;
}

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v(D.email)))e.email='Informe um e-mail válido, como nome@email.com.';
    if(D.senha.length<8)e.senha='A senha precisa ter pelo menos 8 caracteres.';
    if(!D.aceite)e.aceite='Aceite os termos para continuar.';
  }
  if(D.step===3){
    if(v(D.nomeProf).length<2)e.nomeProf='Informe o nome que será exibido no perfil.';
    if(!D.spec)e.spec='Escolha sua especialidade principal.';
    if(!D.cidade)e.cidade='Escolha a cidade.';
  }
  if(D.step===4&&D.tipo==='profissional'&&!D.services.length)e.services='Marque ao menos um procedimento.';
  return e;
}

const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const senhaOk=v=>v.length>=8&&/\d/.test(v)&&/[^A-Za-z0-9]/.test(v);
const digits=v=>String(v||'').replace(/\D/g,'');
function cpfOk(v){
  v=digits(v);if(v.length!==11||/^(\d)\1+$/.test(v))return false;
  for(const n of [9,10]){let s=0;for(let i=0;i<n;i++)s+=+v[i]*(n+1-i);const d=(s*10)%11%10;if(d!==+v[n])return false}
  return true;
}
function cnpjOk(v){
  v=digits(v);if(v.length!==14||/^(\d)\1+$/.test(v))return false;
  for(const n of [12,13]){let s=0,p=n-7;for(let i=0;i<n;i++){s+=+v[i]*p--;if(p<2)p=9}const d=s%11<2?0:11-s%11;if(d!==+v[n])return false}
  return true;
}
const maskTel=v=>{v=digits(v).slice(0,11);return v.length>10?`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`:v.length>6?`(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`:v.length>2?`(${v.slice(0,2)}) ${v.slice(2)}`:v};
const maskDoc=(v,cnpj)=>{v=digits(v).slice(0,cnpj?14:11);
  if(v.length>11)return v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})$/,'$1.$2.$3/$4-$5').replace(/[-/.]$/,'');
  return v.replace(/^(\d{3})(\d{0,3})(\d{0,3})(\d{0,2})$/,(m,a,b,c,d)=>a+(b?'.'+b:'')+(c?'.'+c:'')+(d?'-'+d:''))};
async function hashPw(pw,salt){
  const s=salt+'|'+pw;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
}
const newSalt=()=>Array.from(crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(8)):[1,2,3,4,5,6,7,8],x=>x.toString(16).padStart(2,'0')).join('');

document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='login-form'){
    e.preventDefault();
    const em=$('#l-email').value.trim().toLowerCase(),pw=$('#l-senha').value;AU.email=em;
    const box=$('#l-err');
    if(!emailOk(em)||!pw){box.textContent='Informe seu e-mail e sua senha.';return}
    const acc=findAcc(em);
    if(!acc||await hashPw(pw,acc.salt)!==acc.hash){box.textContent='E-mail ou senha incorretos.';return}
    startSession(acc);AU.senha='';toast('Bem-vinda, '+acc.nome.split(' ')[0]+'!');go('home');
  }
  if(f.id==='signup-form'){
    e.preventDefault();
    const E={},enc=AU.obj==='encontrar';
    if(AU.nome.trim().split(/\s+/).filter(Boolean).length<2||AU.nome.trim().length<5)E.nome='Informe seu nome completo.';
    const tel=digits(AU.tel);if(tel.length<10||tel.length>11)E.tel='Informe o telefone com DDD.';
    if(enc?!cpfOk(AU.doc):!(cpfOk(AU.doc)||cnpjOk(AU.doc)))E.doc=enc?'CPF inválido. Confira os números.':'CPF ou CNPJ inválido. Confira os números.';
    const em=AU.email.trim().toLowerCase();
    if(!emailOk(em))E.email='Informe um e-mail válido, como nome@email.com.';
    else if(findAcc(em))E.email='Este e-mail já tem cadastro. Volte e entre na sua conta.';
    if(!senhaOk(AU.senha))E.senha='A senha precisa de 8 caracteres, um número e um caractere especial.';
    if(!AU.aceite)E.aceite='Aceite os termos para continuar.';
    AU.err=E;
    if(Object.keys(E).length){signupAuthPage();const first=$('.err');first&&first.closest('.af,.ck2')?.querySelector('input,select')?.focus();return}
    const salt=newSalt(),acc={id:'a'+Date.now().toString(36),nome:AU.nome.trim(),tel:AU.tel,doc:AU.doc,email:em,obj:AU.obj,papel:enc?AU.papel:'',salt,hash:await hashPw(AU.senha,salt),criada:new Date().toISOString()};

  }

  const la=pos.coords.latitude,lo=pos.coords.longitude;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&accept-language=pt-BR&lat=${la}&lon=${lo}`);const j=await r.json();
   fillAddr(j.address||{},t,la,lo);setupPage(true,true);toast('Endereço preenchido. Confira o número.')}
  catch(e){if(t!=='w'){P.lat=la;P.lng=lo}toast('Não consegui achar o endereço. Preencha manualmente.')}
 },()=>toast('Permissão negada. Busque o endereço ou preencha manualmente.'),{enableHighAccuracy:true,timeout:12000});

async function cepLookup(t){
 const o=t==='w'?P.w:P,c=digits(o.cep);if(c.length!==8)return;
 try{const r=await fetch('https://viacep.com.br/ws/'+c+'/json/'),j=await r.json();if(j.erro)return;
  if(j.logradouro)o.rua=j.logradouro;if(j.bairro)o.bairro=j.bairro;if(j.localidade)o.cidade=j.localidade;if(j.uf)o.uf=j.uf;setupPage(true,true)}catch(e){}
}
function readPhoto(f){

  const s=320,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(im.width,im.height);
  c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);P.photo=c.toDataURL('image/jpeg',.82);setupPage(true)};im.src=r.result};

     <div class="perm">${Object.entries(PERM_LABELS).map(([pk,l])=>`<label class="ck"><input type="checkbox" data-pperm="${k}:${pk}" ${p.perms[pk]?'checked':''}><span>${l}</span></label>`).join('')}</div></div>`).join('')}</div>`;
  }
  if(A.tab==='mod'){
    body=`<div class="tw"><table><thead><tr><th>Avaliação</th><th>Sobre</th><th>Nota</th><th>Status</th><th>Ações</th></tr></thead><tbody>${SEED_REVIEWS.map(v=>{const st=S.revStatus[v.id]||v.status;return `<tr><td><b style="font-weight:500">${esc(v.autor)}</b><br><small style="color:var(--muted)">${esc(v.texto)}</small></td><td>${esc(v.alvo)}</td><td>${v.nota}/5</td><td>${statusPill(st==='aprovada'?'aprovado':st==='removida'?'recusado':'pendente').replace('Aprovado','Aprovada').replace('Recusado','Removida')}</td><td><div class="row-actions">${st!=='aprovada'?`<button class="btn sm" data-rev="${v.id}:aprovada">Aprovar</button>`:''}${st!=='removida'?`<button class="btn sm ghost" data-rev="${v.id}:removida">Remover</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`;
  }
  app().innerHTML=header('admin')+`<main class="wrap" style="padding-bottom:8px"><div class="adm-warn"><b>Protótipo.</b> Painel aberto para demonstração; os dados ficam só neste navegador. Na versão final, o acesso exige login de administrador.</div>
   <h1 style="font-size:46px">Painel administrativo</h1><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${A.tab===k}" data-atab="${k}">${l}${k==='cad'&&pend?` (${pend})`:''}</button>`).join('')}</div>${body}</main>`+footer();
}

/* ===== Roteador ===== */
const ROUTES=['home','eventos','educacao','campeonatos','lojas','marcas','tecnologia','network','mercado','radar','busca','favoritos','cadastro','meu-perfil','admin','entrar','criar-conta','configurar-perfil','agendamentos','mensagens','perfil'];
function route(){
  let r=(location.hash||'#home').slice(1);if(!ROUTES.includes(r))r='home';
  if(!S.session&&!AUTH_ROUTES.includes(r)){r='entrar';history.replaceState(null,'','#entrar')}
  if(S.session&&AUTH_ROUTES.includes(r)){r='home';history.replaceState(null,'','#home')}
  if(needSetup()&&r!=='configurar-perfil'&&!AUTH_ROUTES.includes(r)){r='configurar-perfil';history.replaceState(null,'','#configurar-perfil')}
  CUR=r;document.body.classList.toggle('appmode',APP_ROUTES.includes(r));
  if(AUTH_ROUTES.includes(r)){authPage(r);document.title=(r==='entrar'?'Entrar':'Criar conta')+' | Beauty Hub';return}
  if(MODS[r])modPage(r);
  else({home:homePage,mercado:mercadoPage,network:netPage,radar:radarPage,busca:searchPage,favoritos:favPage,cadastro:signupPage,'meu-perfil':meuPerfil,admin:adminPage,'configurar-perfil':()=>setupPage(),agendamentos:agendaPage,mensagens:msgPage,perfil:perfilPage})[r]();
  const t={home:'Beauty Hub',cadastro:'Cadastro | Beauty Hub','meu-perfil':'Meu perfil | Beauty Hub',admin:'Admin | Beauty Hub',busca:'Busca | Beauty Hub',favoritos:'Favoritos | Beauty Hub',mercado:'Mercado | Beauty Hub',network:'Network | Beauty Hub',radar:'Radar | Beauty Hub','configurar-perfil':(needSetup()?'Complete seu cadastro':'Editar perfil')+' | Beauty Hub',agendamentos:'Agendamentos | Beauty Hub',mensagens:'Mensagens | Beauty Hub',perfil:'Perfil | Beauty Hub'};
  document.title=t[r]||(MOD_NAME[r]+' | Beauty Hub');
  window.scrollTo(0,0);
}
function go(r){if(location.hash==='#'+r)route();else location.hash=r}
function refreshHeader(){const h=$('.hdr');if(h){const o=$('#nav')?.classList.contains('open');h.outerHTML=header(CUR);if(o)$('#nav')?.classList.add('open')}}
function syncFav(id){
  const f=S.favs.includes(id);
  $$(`[data-fav="${id}"]`).forEach(b=>{b.classList.toggle('on',f);b.setAttribute('aria-pressed',f);if(b.classList.contains('heart'))b.setAttribute('aria-label',f?'Remover dos favoritos':'Salvar nos favoritos');else{const s=$('span',b);if(s)s.textContent=f?'Salvo nos favoritos':'Salvar nos favoritos'}});
  refreshHeader();
}

/* ===== Eventos de interface ===== */
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(t.id==='ov'||t.closest('[data-close]')){closeSheet();return}
  if(el=t.closest('[data-fav]')){const id=el.dataset.fav,i=S.favs.indexOf(id);if(i>=0)S.favs.splice(i,1);else S.favs.push(id);save();syncFav(id);toast(i>=0?'Removido dos favoritos':'Salvo nos favoritos');if(CUR==='favoritos'&&$('#ov').hidden)favPage();return}
  if(el=t.closest('[data-follow]')){const id=el.dataset.follow,i=S.follows.indexOf(id);if(i>=0)S.follows.splice(i,1);else S.follows.push(id);save();$$(`[data-follow="${id}"]`).forEach(b=>{b.textContent=i>=0?'Seguir':'Seguindo';b.setAttribute('aria-pressed',i<0)});toast(i>=0?'Você deixou de seguir':'Você está seguindo');return}
  if(el=t.closest('[data-meet]')){const k='m:'+el.dataset.meet,i=S.joined.indexOf(k);if(i>=0)S.joined.splice(i,1);else S.joined.push(k);save();toast(i>=0?'Participação cancelada':'Participação confirmada');if(CUR==='network')netPage();if(!$('#ov').hidden)openItem(el.dataset.meet);return}
  if(el=t.closest('[data-group]')){const k='g:'+el.dataset.group,i=S.joined.indexOf(k);if(i>=0)S.joined.splice(i,1);else S.joined.push(k);save();toast(i>=0?'Você saiu do grupo':'Você entrou no grupo');netPage();return}
  if(el=t.closest('[data-interest]')){const id=el.dataset.interest,i=S.interest.indexOf(id);if(i>=0)S.interest.splice(i,1);else S.interest.push(id);save();el.textContent=i>=0?'Tenho interesse':'Interesse registrado';el.setAttribute('aria-pressed',i<0);toast(i>=0?'Interesse removido':'Interesse registrado');return}
  if(el=t.closest('[data-thread]')){openThread(el.dataset.thread);return}
  if(el=t.closest('[data-reply]')){const id=el.dataset.reply,v=$('#reply-t').value.trim();if(!v){toast('Escreva sua resposta antes de enviar');return}(S.replies[id]=S.replies[id]||[]).push([S.user?(S.user.nomeProf||S.user.nome):'Você',v]);save();openThread(id);toast('Resposta enviada');if(CUR==='network')netPage();return}
  if(el=t.closest('[data-open]')){openItem(el.dataset.open);return}
  if(el=t.closest('[data-info]')){openInfo(el.dataset.info);return}
  if(el=t.closest('[data-signup]')){D=newDraft(el.dataset.signup);go('cadastro');return}
  if(el=t.closest('[data-go]')){closeSheet();$('#nav')?.classList.remove('open');go(el.dataset.go);return}
  if(t.closest('[data-menu]')){const n=$('#nav'),o=n.classList.toggle('open');t.closest('[data-menu]').setAttribute('aria-expanded',o);return}
  /* cadastro */
  if(el=t.closest('[data-tipo]')){D.tipo=el.dataset.tipo;stepRender();return}
  if(t.closest('[data-snext]')){nextStep();return}
  if(t.closest('[data-sback]')){D.step--;if(D.step===2)D.step=1;D.err={};stepRender();return}
  if(el=t.closest('[data-cycle]')){D.cycle=el.dataset.cycle;stepRender();return}
  if(el=t.closest('[data-plan]')){D.plano=el.dataset.plan;stepRender();return}
  if(t.closest('[data-sfinish]')){finishSignup();return}
  /* perfil */
  if(el=t.closest('[data-ptab]')){PT=el.dataset.ptab;meuPerfil();return}
  if(t.closest('[data-delete-profile]')){if(t.closest('[data-delete-profile]').dataset.sure){S.user=null;save();D=newDraft();toast('Cadastro excluído');meuPerfil()}else{const b=t.closest('[data-delete-profile]');b.dataset.sure='1';b.textContent='Toque de novo para confirmar a exclusão'}return}
  /* admin */
  if(el=t.closest('[data-atab]')){A.tab=el.dataset.atab;adminPage();return}
  if(el=t.closest('[data-areg]')){A.reg=el.dataset.areg;adminPage();return}
  if(el=t.closest('[data-reg]')){const [id,st]=el.dataset.reg.split(':');setReg(id,st);toast('Status atualizado: '+st);adminPage();return}
  if(el=t.closest('[data-rev]')){const [id,st]=el.dataset.rev.split(':');S.revStatus[id]=st;save();toast('Avaliação '+st);adminPage();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeSheet()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind){const k=t.dataset.bind;D[k]=t.type==='checkbox'?t.checked:t.value;if(D.err[k]){delete D.err[k];const er=t.closest('.f,.ck')?.querySelector('.err');if(er)er.remove()}if(k==='bio')$('#bio-n').textContent=t.value.length}
  if(t.dataset&&t.dataset.svc){const s=t.dataset.svc,i=D.services.indexOf(s);if(t.checked&&i<0)D.services.push(s);if(!t.checked&&i>=0)D.services.splice(i,1);D.err.services&&(delete D.err.services,$('.err')?.remove())}
  if(t.id==='svc-q'){const q=norm(t.value);$$('#svc [data-s]').forEach(l=>{l.hidden=q&&!l.dataset.s.includes(q)})}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.bind==='uf'){D.uf=t.value;D.cidade=STATES[D.uf][0];stepRender();return}
  if(d.afeat){S.feat[d.afeat]=t.checked;save();toast('Destaque atualizado');return}
  if(d.ahide){S.hidden[d.ahide]=!t.checked;save();toast(t.checked?'Item visível':'Item oculto nas páginas públicas');return}
  if(d.pprice||d.pproc||d.pperm){
    const P=PLANS();
    if(d.pprice){const n=parseFloat(t.value);if(!(n>=0)){toast('Informe um preço válido');return}P[d.pprice].price=n}
    if(d.pproc){const n=parseInt(t.value,10);if(!(n>=0)){toast('Informe um limite válido');return}P[d.pproc].perms.proc=n}
    if(d.pperm){const [pk,perm]=d.pperm.split(':');P[pk].perms[perm]=t.checked}
    S.plans=P;save();toast('Plano atualizado');
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='q-form'){S.q=$('#q').value.trim();save();if(CUR==='busca')searchPage();else go('busca');return}
  if(f.id==='contact-form'){
    const wa=$('#c-wa').value.replace(/\D/g,''),ig=$('#c-ig').value.trim().replace(/^@/,''),ag=$('#c-ag').value.trim();
    if(wa&&(wa.length<10||wa.length>11)){toast('WhatsApp: informe DDD e número, só com números');return}
    if(ig&&!/^[A-Za-z0-9._]{1,30}$/.test(ig)){toast('Instagram: use só letras, números, ponto e sublinhado');return}
    if(ag&&!/^https:\/\/[^\s]+$/.test(ag)){toast('Link de agendamento: use um endereço começando com https://');return}
    S.user.wa=wa?'55'+wa:'';S.user.ig=ig;if(!$('#c-ag').disabled)S.user.agenda=ag;save();toast('Contatos salvos');meuPerfil();
  }
});
addEventListener('hashchange',route);
document.addEventListener('DOMContentLoaded',route);
if(document.readyState!=='loading')route();

</script>
